name: Verify PrismWave Studio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "launch/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and refresh npm lockfile
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Lint
        run: npm run lint
